<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Technical Brickwork</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    :root {
      --bg:      #1a1a1a;
      --raised:  #242424;
      --surface: #2e2e2e;
      --text:    #f0f0f0;
      --muted:   #888;
      --accent:  #c8a96e;
      --green:   #4caf7d;
      --border:  rgba(255,255,255,0.08);
      --font:    system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }
    .login-logo {
      width: 72px; height: 72px;
      border-radius: 50%;
      margin-bottom: 0.5rem;
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }
    .login-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .btn-login {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 13px 32px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
      font-family: var(--font);
    }
    .btn-login:hover { background: var(--accent); color: var(--bg); }

    /* ── ADMIN SCREEN ── */
    #admin-screen { display: none; }

    header {
      background: var(--raised);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .header-left {
      display: flex; align-items: center; gap: 12px;
    }
    .header-left img {
      width: 36px; height: 36px;
      border-radius: 50%;
    }
    .header-left h1 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .header-left span {
      font-size: 0.75rem;
      color: var(--muted);
      display: block;
    }
    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 16px;
      font-size: 0.78rem;
      cursor: pointer;
      border-radius: 2px;
      font-family: var(--font);
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--muted); color: var(--text); }

    /* ── STATS ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat {
      background: var(--raised);
      padding: 1.2rem 1.5rem;
      text-align: center;
    }
    .stat-num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-top: 4px;
    }

    /* ── FILTERS ── */
    .filters {
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      background: var(--raised);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 20px;
      font-family: var(--font);
      transition: all 0.2s;
    }
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(200,169,110,0.1);
    }

    /* ── LEADS ── */
    .leads {
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .lead-card {
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .lead-card.done {
      opacity: 0.45;
    }
    .lead-card:hover { border-color: rgba(200,169,110,0.3); }

    .lead-header {
      padding: 1rem 1.2rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .lead-info h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .lead-meta {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .lead-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .service-badge {
      display: inline-block;
      background: rgba(200,169,110,0.15);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: capitalize;
      white-space: nowrap;
    }
    .lead-message {
      padding: 0 1.2rem 1rem;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      font-style: italic;
    }
    .lead-message:empty { display: none; }

    .lead-actions {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      background: var(--raised);
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.2s;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .action-btn:hover { background: var(--surface); color: var(--text); }
    .action-btn.call:hover { color: var(--green); }
    .action-btn.done-btn:hover { color: var(--accent); }
    .action-btn.whatsapp:hover { color: #25d366; }

    .new-badge {
      display: inline-block;
      background: var(--green);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-left: 6px;
      vertical-align: middle;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 480px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .lead-header { flex-direction: column; gap: 0.5rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <img src="/images/logo.png" alt="Technical Brickwork" class="login-logo" />
  <h2 class="login-title">Technical Brickwork</h2>
  <p class="login-sub">Admin access only</p>
  <button class="btn-login" id="btn-login">Log In</button>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <header>
    <div class="header-left">
      <img src="/images/logo.png" alt="Technical Brickwork" />
      <div>
        <h1>Quote Leads</h1>
        <span id="last-updated">Loading...</span>
      </div>
    </div>
    <button class="btn-logout" id="btn-logout">Log Out</button>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-new">0</div>
      <div class="stat-label">New</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-done">0</div>
      <div class="stat-label">Done</div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="new">New only</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>

  <div class="leads" id="leads-list">
    <div class="loading">Loading leads...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = import.meta.env ? import.meta.env.VITE_SUPABASE_URL : ''
  const SUPABASE_KEY = import.meta.env ? import.meta.env.VITE_SUPABASE_ANON_KEY : ''

  let allLeads = []
  let currentFilter = 'all'

  // ── NETLIFY IDENTITY ──
  netlifyIdentity.on('init', user => {
    if (user) showAdmin()
  })
  netlifyIdentity.on('login', user => {
    netlifyIdentity.close()
    showAdmin()
  })
  netlifyIdentity.on('logout', () => {
    document.getElementById('login-screen').style.display = 'flex'
    document.getElementById('admin-screen').style.display = 'none'
  })

  document.getElementById('btn-login').addEventListener('click', () => {
    netlifyIdentity.open('login')
  })
  document.getElementById('btn-logout').addEventListener('click', () => {
    netlifyIdentity.logout()
  })

  function showAdmin() {
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('admin-screen').style.display = 'block'
    loadLeads()
  }

  // ── LOAD LEADS ──
  async function loadLeads() {
    try {
      const user = netlifyIdentity.currentUser()
      const token = user ? await user.jwt() : null

      const res = await fetch(`${SUPABASE_URL}/rest/v1/quotes?order=created_at.desc`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      })
      allLeads = await res.json()
      updateStats()
      renderLeads()

      const now = new Date()
      document.getElementById('last-updated').textContent =
        `Updated ${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`
    } catch (err) {
      document.getElementById('leads-list').innerHTML =
        '<div class="empty-state">Could not load leads. Check your connection.</div>'
    }
  }

  function updateStats() {
    const newCount  = allLeads.filter(l => l.status === 'new').length
    const doneCount = allLeads.filter(l => l.status === 'done').length
    document.getElementById('stat-total').textContent = allLeads.length
    document.getElementById('stat-new').textContent   = newCount
    document.getElementById('stat-done').textContent  = doneCount
  }

  function renderLeads() {
    const filtered = allLeads.filter(l => {
      if (currentFilter === 'new')  return l.status === 'new'
      if (currentFilter === 'done') return l.status === 'done'
      return true
    })

    const list = document.getElementById('leads-list')
    if (!filtered.length) {
      list.innerHTML = '<div class="empty-state">No leads found.</div>'
      return
    }

    list.innerHTML = filtered.map(lead => {
      const date = new Date(lead.created_at).toLocaleDateString('en-GB', {
        day: 'numeric', month: 'short', year: 'numeric'
      })
      const time = new Date(lead.created_at).toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit'
      })
      const isNew = lead.status === 'new'
      const phone = lead.phone?.replace(/\s/g, '') || ''
      const waMsg = encodeURIComponent(`Hi ${lead.name}, thanks for your enquiry with Technical Brickwork. We'd love to help with your ${lead.service} project.`)

      return `
        <div class="lead-card ${isNew ? '' : 'done'}" id="lead-${lead.id}">
          <div class="lead-header">
            <div class="lead-info">
              <h3>${lead.name || 'Unknown'}${isNew ? '<span class="new-badge">New</span>' : ''}</h3>
              <div class="lead-meta">
                <span>📍 ${lead.postcode || 'No postcode'}</span>
                <span>📅 ${date} ${time}</span>
                <span>📞 ${lead.contact_method || 'Not specified'}</span>
              </div>
              ${lead.service ? `<div style="margin-top:6px"><span class="service-badge">${lead.service}</span></div>` : ''}
            </div>
          </div>
          ${lead.message ? `<div class="lead-message">"${lead.message}"</div>` : ''}
          <div class="lead-actions">
            <a href="tel:${phone}" class="action-btn call">📞 Call</a>
            <a href="https://wa.me/${phone.replace('+','')}?text=${waMsg}" class="action-btn whatsapp" target="_blank">💬 WhatsApp</a>
            <button class="action-btn done-btn" onclick="markDone(${lead.id})">${isNew ? '✓ Mark Done' : '↩ Reopen'}</button>
          </div>
        </div>
      `
    }).join('')
  }

  // ── MARK DONE / REOPEN ──
  async function markDone(id) {
    const lead = allLeads.find(l => l.id === id)
    const newStatus = lead.status === 'new' ? 'done' : 'new'

    await fetch(`${SUPABASE_URL}/rest/v1/quotes?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({ status: newStatus })
    })

    lead.status = newStatus
    updateStats()
    renderLeads()
  }

  // ── FILTERS ──
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      currentFilter = btn.dataset.filter
      renderLeads()
    })
  })

  // Auto-refresh every 60 seconds
  setInterval(() => {
    if (document.getElementById('admin-screen').style.display !== 'none') loadLeads()
  }, 60000)
</script>
</body>
</html>
